server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing — always fall back to index.html for
    # unknown paths (the routes themselves are handled by the SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Note: in production this container does not proxy /api itself — either
    # bake the backend's public URL into the build via the API_BASE_URL
    # build arg, or put this container behind a reverse proxy / gateway that
    # forwards /api to the backend service (the top-level Docker Compose
    # pass, per PLATFORM_CONTRACT.md §1/§11, owns that wiring).
}
